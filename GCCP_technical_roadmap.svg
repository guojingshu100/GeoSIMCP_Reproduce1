<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="blueHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f78b5"/><stop offset="1" stop-color="#28598d"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#e6f0fa"/>
    </linearGradient>
    <linearGradient id="summaryFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4e5ad"/><stop offset="1" stop-color="#9fcf86"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#617080" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f6f9d"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d78435"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", SimHei, sans-serif; }
      .pageTitle { font-size: 29px; font-weight: 700; fill: #173d67; }
      .section { font-size: 22px; font-weight: 700; fill: #fff; }
      .node { font-size: 17px; font-weight: 600; fill: #253e56; }
      .small { font-size: 15px; font-weight: 500; fill: #253e56; }
      .label { font-size: 15px; font-weight: 700; fill: #35638e; }
      .summary { font-size: 23px; font-weight: 700; fill: #1b4520; }
      .flow { fill: none; stroke: #3f6f9d; stroke-width: 2.5; marker-end: url(#arrow); }
      .orangeFlow { fill: none; stroke: #d78435; stroke-width: 2.5; marker-end: url(#arrowOrange); }
    </style>
  </defs>

  <rect x="12" y="12" width="1576" height="976" rx="10" fill="#fff" stroke="#aebdca" stroke-width="2"/>
  <text x="800" y="45" text-anchor="middle" class="pageTitle">GCCP：融合地理邻近与因果信息的空间预测不确定性量化</text>

  <!-- Part 1 -->
  <g filter="url(#shadow)">
    <rect x="45" y="70" width="735" height="430" rx="10" fill="#fbfdff" stroke="#7395b5" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="45" y="70" width="735" height="48" rx="9" fill="url(#blueHead)"/>
  </g>
  <text x="412" y="101" text-anchor="middle" class="section">① 融合地理邻近与因果信息的局部相似性构建</text>

  <text x="225" y="143" text-anchor="middle" class="label">地理分支</text>
  <text x="595" y="143" text-anchor="middle" class="label">变量因果分支</text>
  <g>
    <rect x="80" y="155" width="290" height="52" rx="5" fill="url(#blueCard)" stroke="#9eb8ce"/>
    <rect x="80" y="225" width="290" height="52" rx="5" fill="#fff" stroke="#c3ced8"/>
    <rect x="80" y="295" width="290" height="52" rx="5" fill="#fff" stroke="#c3ced8"/>
    <rect x="455" y="155" width="290" height="52" rx="5" fill="url(#blueCard)" stroke="#9eb8ce"/>
    <rect x="455" y="225" width="290" height="52" rx="5" fill="#fff" stroke="#c3ced8"/>
    <rect x="455" y="295" width="290" height="52" rx="5" fill="#fff" stroke="#c3ced8"/>
  </g>
  <text x="225" y="187" text-anchor="middle" class="node">地理位置坐标</text>
  <text x="225" y="257" text-anchor="middle" class="node">空间距离</text>
  <text x="225" y="327" text-anchor="middle" class="node">地理邻近性</text>
  <text x="600" y="187" text-anchor="middle" class="node">属性变量 + 预测目标</text>
  <text x="600" y="257" text-anchor="middle" class="small">变量因果信息估计</text>
  <text x="600" y="317" text-anchor="middle" class="small"><tspan x="600" dy="0">因果信息加权的</tspan><tspan x="600" dy="20">属性距离</tspan></text>
  <path d="M225 207 L225 220" class="flow"/><path d="M225 277 L225 290" class="flow"/>
  <path d="M600 207 L600 220" class="flow"/><path d="M600 277 L600 290" class="flow"/>
  <path d="M600 347 L600 360" class="flow"/>
  <rect x="455" y="365" width="290" height="52" rx="5" fill="#fff" stroke="#c3ced8"/>
  <text x="600" y="397" text-anchor="middle" class="node">属性机制相似性</text>
  <rect x="130" y="385" width="250" height="52" rx="5" fill="#fff" stroke="#c3ced8"/>
  <text x="255" y="417" text-anchor="middle" class="node">地理邻近性</text>
  <path d="M225 347 C225 370 255 380 255 380" class="orangeFlow"/>
  <path d="M380 411 L430 411" class="orangeFlow"/>
  <path d="M600 417 C600 430 540 442 490 442" class="orangeFlow"/>
  <rect x="155" y="442" width="560" height="42" rx="5" fill="#e7f1fb" stroke="#7298bb" stroke-width="2"/>
  <text x="435" y="469" text-anchor="middle" class="small">地理邻近性 + 因果信息加权属性相似性 → 联合局部相似性 → 局部校准权重</text>

  <!-- Part 2 -->
  <g filter="url(#shadow)">
    <rect x="820" y="70" width="735" height="430" rx="10" fill="#fbfdff" stroke="#7395b5" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="820" y="70" width="735" height="48" rx="9" fill="url(#blueHead)"/>
  </g>
  <text x="1187" y="101" text-anchor="middle" class="section">② 基于局部权重的 GCCP 不确定性量化</text>
  <text x="1187" y="143" text-anchor="middle" class="label">数据划分与非测试数据工作流</text>
  <g>
    <rect x="842" y="155" width="110" height="48" rx="4" fill="url(#blueCard)" stroke="#9eb8ce"/>
    <rect x="970" y="155" width="110" height="48" rx="4" fill="#fff" stroke="#c3ced8"/>
    <rect x="1098" y="155" width="110" height="48" rx="4" fill="#fff" stroke="#c3ced8"/>
    <rect x="1226" y="155" width="110" height="48" rx="4" fill="#fff" stroke="#c3ced8"/>
    <rect x="1354" y="155" width="110" height="48" rx="4" fill="#fff" stroke="#c3ced8"/>
  </g>
  <text x="897" y="185" text-anchor="middle" class="small">数据划分</text>
  <text x="1025" y="185" text-anchor="middle" class="small">训练集</text>
  <text x="1153" y="185" text-anchor="middle" class="small">尺度拟合集</text>
  <text x="1281" y="185" text-anchor="middle" class="small">校准集</text>
  <text x="1409" y="185" text-anchor="middle" class="small">测试集</text>
  <path d="M952 179 L965 179" class="orangeFlow"/><path d="M1080 179 L1093 179" class="orangeFlow"/><path d="M1208 179 L1221 179" class="orangeFlow"/><path d="M1336 179 L1349 179" class="orangeFlow"/>

  <g>
    <rect x="850" y="235" width="300" height="52" rx="5" fill="url(#blueCard)" stroke="#9eb8ce"/>
    <rect x="1225" y="235" width="300" height="52" rx="5" fill="#fff" stroke="#c3ced8"/>
    <rect x="850" y="310" width="300" height="52" rx="5" fill="#fff" stroke="#c3ced8"/>
    <rect x="1225" y="310" width="300" height="52" rx="5" fill="#fff" stroke="#c3ced8"/>
    <rect x="850" y="385" width="300" height="52" rx="5" fill="#fff" stroke="#c3ced8"/>
    <rect x="1225" y="385" width="300" height="52" rx="5" fill="#e7f1fb" stroke="#7298bb" stroke-width="2"/>
  </g>
  <text x="1000" y="267" text-anchor="middle" class="small">训练集拟合随机森林预测模型</text>
  <text x="1375" y="258" text-anchor="middle" class="small"><tspan x="1375" dy="0">使用非测试数据估计</tspan><tspan x="1375" dy="20">因果信息与局部尺度</tspan></text>
  <text x="1000" y="332" text-anchor="middle" class="small">校准集计算非一致性分数</text>
  <text x="1375" y="332" text-anchor="middle" class="small">根据测试样本计算局部校准权重</text>
  <text x="1000" y="417" text-anchor="middle" class="node">加权分位数</text>
  <text x="1375" y="417" text-anchor="middle" class="node">GCCP 局部预测区间</text>
  <path d="M1000 287 L1000 305" class="flow"/><path d="M1150 261 C1180 261 1195 261 1220 261" class="flow"/>
  <path d="M1375 287 L1375 305" class="flow"/><path d="M1150 336 C1180 336 1195 336 1220 336" class="flow"/>
  <path d="M1000 362 L1000 380" class="flow"/><path d="M1150 411 L1220 411" class="flow"/>

  <!-- connector between the two top sections -->
  <path d="M780 285 L815 285" class="orangeFlow"/>
  <text x="797" y="267" text-anchor="middle" class="label">局部相似性</text>

  <!-- connector to Part 3 -->
  <path d="M1187 500 L1187 545" class="flow"/>
  <text x="1215" y="527" class="label">不确定性量化</text>

  <!-- Part 3 -->
  <g filter="url(#shadow)">
    <rect x="45" y="555" width="1510" height="330" rx="10" fill="#fbfdff" stroke="#7395b5" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="45" y="555" width="1510" height="48" rx="9" fill="url(#blueHead)"/>
  </g>
  <text x="800" y="586" text-anchor="middle" class="section">③ GCCP 方法验证与问题诊断</text>

  <!-- three groups -->
  <g>
    <rect x="75" y="625" width="440" height="114" rx="6" fill="#fff" stroke="#c3ced8"/>
    <rect x="580" y="625" width="440" height="114" rx="6" fill="#fff" stroke="#c3ced8"/>
    <rect x="1085" y="625" width="440" height="114" rx="6" fill="#fff" stroke="#c3ced8"/>
  </g>
  <text x="295" y="651" text-anchor="middle" class="label">方法对比</text>
  <text x="800" y="651" text-anchor="middle" class="label">实验验证</text>
  <text x="1305" y="651" text-anchor="middle" class="label">评价指标</text>
  <text x="180" y="690" class="small">共形预测（CP）</text><text x="365" y="690" class="small">地理共形预测（GeoCP）</text>
  <text x="210" y="718" class="small">地理相似共形预测（GeoSIMCP）</text><text x="445" y="718" class="small">GCCP</text>
  <text x="605" y="690" class="small">参数实验</text><text x="750" y="690" class="small">消融实验</text><text x="880" y="690" class="small">多随机种子重复实验</text>
  <text x="605" y="718" class="small">模拟实验</text><text x="750" y="718" class="small">PM2.5 实验</text>
  <text x="1110" y="690" class="small">覆盖率</text><text x="1240" y="690" class="small">区间宽度</text><text x="1370" y="690" class="small">区间评分</text>
  <text x="1305" y="718" text-anchor="middle" class="small">综合比较</text>

  <path d="M295 739 L295 754" class="flow"/><path d="M800 739 L800 754" class="flow"/><path d="M1305 739 L1305 754" class="flow"/>
  <rect x="405" y="755" width="790" height="46" rx="6" fill="#e7f1fb" stroke="#7298bb" stroke-width="2"/>
  <text x="800" y="784" text-anchor="middle" class="node">验证因果信息是否真正改善局部预测不确定性量化</text>

  <path d="M800 801 L800 817" class="flow"/>
  <text x="95" y="846" class="label">异常结果</text>
  <path d="M180 842 L215 842" class="orangeFlow"/>
  <rect x="225" y="817" width="175" height="42" rx="4" fill="#fff" stroke="#c3ced8"/><text x="312" y="844" text-anchor="middle" class="small">检查数据</text>
  <path d="M400 838 L425 838" class="orangeFlow"/>
  <rect x="435" y="817" width="175" height="42" rx="4" fill="#fff" stroke="#c3ced8"/><text x="522" y="844" text-anchor="middle" class="small">检查权重</text>
  <path d="M610 838 L635 838" class="orangeFlow"/>
  <rect x="645" y="817" width="175" height="42" rx="4" fill="#fff" stroke="#c3ced8"/><text x="732" y="844" text-anchor="middle" class="small">检查参数</text>
  <path d="M820 838 L845 838" class="orangeFlow"/>
  <rect x="855" y="817" width="175" height="42" rx="4" fill="#fff" stroke="#c3ced8"/><text x="942" y="844" text-anchor="middle" class="small">检查代码实现</text>
  <path d="M1030 838 L1055 838" class="orangeFlow"/>
  <rect x="1065" y="817" width="190" height="42" rx="4" fill="#fff" stroke="#c3ced8"/><text x="1160" y="844" text-anchor="middle" class="small">检查实验设置</text>
  <path d="M1255 838 L1280 838" class="orangeFlow"/>
  <rect x="1290" y="817" width="175" height="42" rx="4" fill="#e7f1fb" stroke="#7298bb"/><text x="1377" y="844" text-anchor="middle" class="small">重复验证</text>

  <!-- Bottom summary -->
  <path d="M800 886 L800 911" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="220" y="915" width="1160" height="57" rx="10" fill="url(#summaryFill)" stroke="#568e4f" stroke-width="2"/>
  </g>
  <text x="800" y="951" text-anchor="middle" class="summary">融合地理邻近与因果信息的空间预测不确定性量化与验证</text>
</svg>
